# Mutual TLS with Java keystores, the typical setup for Java/Spring/Micronaut services.
# Several clusters share one TLS block through a YAML anchor.
#
# Passwords are read from files at startup and never appear in this config.
# keytool has written PKCS#12 by default since Java 9, even into files named .jks;
# kafka-mcp detects the real format from the contents.

clusters:
  - name: orders-dc1
    brokers: ["kafka-dc1.example.com:9093"]
    security_protocol: SSL
    tls: &corp-tls
      truststore: ~/certs/truststore/truststore.jks
      truststore_password: ${file:~/certs/truststore/pw.txt}
      keystore: ~/certs/client/keystore.jks
      keystore_password: ${file:~/certs/client/pw.txt}
      # Brokers advertise IPs that are not in their certificates. Java clients
      # handle this with ssl.endpoint.identification.algorithm=''. This keeps
      # full chain verification and skips only the name match.
      verify_hostname: false

  - name: orders-dc2
    brokers: ["kafka-dc2.example.com:9093"]
    security_protocol: SSL
    tls: *corp-tls
